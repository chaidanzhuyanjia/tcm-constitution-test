name: HERB2 endpoint diagnostic
on:
  push:
    branches: [herb2-cp-extractor]
    paths:
      - 'herb2_endpoint_diag.py'
      - '.github/workflows/herb2_endpoint_diag.yml'
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python herb2_endpoint_diag.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: herb2-endpoint-diagnostic
          path: diag_output
          retention-days: 7
