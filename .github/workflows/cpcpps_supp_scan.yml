name: CP/CPPS supplementary scan
on:
  push:
    branches: [herb2-cp-extractor]
    paths:
      - 'download_cpcpps_supp.py'
      - '.github/workflows/cpcpps_supp_scan.yml'
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests openpyxl
      - run: python download_cpcpps_supp.py
      - uses: actions/upload-artifact@v4
        with:
          name: cpcpps-supp-scan
          path: cpcpps_supp
          retention-days: 7
