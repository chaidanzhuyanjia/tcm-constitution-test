name: HERB2 inferred target sensitivity
on:
  push:
    branches: [herb2-cp-extractor]
    paths: ['herb2_inferred_targets.py','.github/workflows/herb2_inferred_targets.yml']
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - run: python herb2_inferred_targets.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: herb2-inferred-targets
          path: herb2_inferred_targets
          retention-days: 7
