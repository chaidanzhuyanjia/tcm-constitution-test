name: Fetch PXD025005 supplement
on:
  push:
    branches: [herb2-cp-extractor]
    paths:
      - 'fetch_pxd025005.py'
      - '.github/workflows/fetch_pxd025005.yml'
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python fetch_pxd025005.py
      - uses: actions/upload-artifact@v4
        with:
          name: pxd025005-supplement
          path: pxd025005_fetch
          retention-days: 7
